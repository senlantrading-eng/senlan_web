name: SEO static checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_news_images.py
      - run: python scripts/validate_news.py
      - run: python scripts/test_sitemaps.py
      - run: python scripts/generate_sitemaps.py
      - run: python scripts/check_seo.py
      - run: node --check product-page.js
